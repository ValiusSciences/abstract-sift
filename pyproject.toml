[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstract-sift"
version = "0.1.0"
description = "Resumable research abstract screening with OpenAI Decisions and TypeSafe JEV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
abstract-sift = "abstract_sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abstract_sift = ["web/*.html", "web/*.css", "web/*.js"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "coverage>=7.17.0",
]
